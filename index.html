<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"/>
<meta name="theme-color" content="#166534"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<title>樹木工作紀錄</title>
<link rel="manifest" href="manifest.json"/>
<link rel="icon" href="icon.svg"/>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<style>
:root{--g:#166534;--g2:#15803d;--bg:#f0fdf4;--card:#fff;--line:#d1fae5;--muted:#64748b;--danger:#b91c1c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;background:var(--bg);color:#0f172a;padding-bottom:88px}
header{background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;padding:16px 16px 14px;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:18px;font-weight:700}
header p{margin:4px 0 0;font-size:12px;opacity:.9}
main{padding:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.card.sel{outline:2px solid var(--g);background:#f0fdf4}
label{display:block;font-size:13px;font-weight:600;margin:10px 0 6px}
input,textarea,select{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:16px;font-family:inherit;background:#fff}
.photos{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.ph{aspect-ratio:1;border:2px dashed #86efac;border-radius:14px;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--g);font-size:13px;font-weight:600;background:#f8fafc;overflow:hidden;position:relative}
.ph img{width:100%;height:100%;object-fit:cover}
.ph small{display:block;font-weight:500;color:var(--muted);font-size:11px;margin-top:4px}
.btn{width:100%;border:0;border-radius:14px;padding:14px;font-size:16px;font-weight:700;background:var(--g);color:#fff;margin-top:10px}
.btn2{background:#fff;color:var(--g);border:1px solid var(--g)}
.btn3{background:#e2e8f0;color:#334155}
.btn4{background:#fef2f2;color:var(--danger)}
.btn.sm{padding:10px;font-size:14px;margin-top:0}
.btn:disabled{opacity:.5}
.muted{color:var(--muted);font-size:12px;line-height:1.5}
.help{background:#ecfdf5;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:10px;color:#14532d}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center}
.title{font-weight:700;font-size:15px}
.tag{font-size:11px;padding:3px 8px;border-radius:999px;background:#dcfce7;color:#166534;font-weight:600}
.toast{display:none;position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 14px;border-radius:999px;font-size:13px;z-index:20;max-width:90%}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr 1fr;padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:10}
nav button{border:0;background:transparent;padding:8px;font-size:11px;color:var(--muted)}
nav button.on{color:var(--g);font-weight:700}
nav span{display:block;font-size:18px;margin-bottom:2px}
.empty{text-align:center;color:var(--muted);padding:28px 10px}
.check{width:22px;height:22px;accent-color:var(--g);flex-shrink:0}
.bar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 10px}
</style>
</head>
<body>
<header>
  <h1>樹木工作紀錄</h1>
  <p>前線用 · 多選合併分享 · 相片含日期／事前事後 · v4</p>
</header>
<main id="app"></main>
<nav>
  <button class="on" id="n-new" onclick="go('new')"><span>➕</span>新紀錄</button>
  <button id="n-list" onclick="go('list')"><span>🌳</span>本機紀錄</button>
  <button id="n-me" onclick="go('me')"><span>ℹ️</span>說明</button>
</nav>
<div class="toast" id="toast"></div>
<input type="file" id="cam" accept="image/*" capture="environment" style="position:fixed;left:-9999px;width:1px;height:1px;opacity:0" onchange="onCam(event)"/>
<script>
const $=id=>document.getElementById(id);
const KEY="tree_records_v1";
const UPLOAD_KEY="tree_upload_url_v1";
function getUploadUrl(){return (localStorage.getItem(UPLOAD_KEY)||"").trim();}
function setUploadUrl(u){localStorage.setItem(UPLOAD_KEY,(u||"").trim());}
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));return Array.isArray(x)?x:[];}catch(e){return[];}}
function saveAll(list){localStorage.setItem(KEY,JSON.stringify(list));}
let records=load();
let page="new";
let draft={treeNo:"",note:"",info:null,before:null,after:null};
let snapTarget=null;
let viewing=null;
let selected=new Set();

function toast(t){const el=$("toast");el.textContent=t;el.style.display="block";setTimeout(()=>el.style.display="none",2400);}
function go(p){page=p;viewing=null;if(p!=="list")selected=new Set();["n-new","n-list","n-me"].forEach(id=>$(id).classList.remove("on"));({new:"n-new",list:"n-list",me:"n-me"})[p]&&$(({new:"n-new",list:"n-list",me:"n-me"})[p]).classList.add("on");render();}
function render(){if(viewing)return viewOne(viewing);if(page==="new")viewNew();else if(page==="list")viewList();else viewMe();}
function fmt(ts){return new Date(ts||Date.now()).toLocaleString("zh-HK",{year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"});}
function safeName(s){return String(s||"tree").replace(/[\\/:*?"<>|]/g,"_");}

function phBox(key,label){
  const src=draft[key];
  return '<div><label>'+label+'</label><div class="ph" onclick="snap(\''+key+'\')">'+(src?'<img alt="" src="'+src+'"/>':('＋ 拍照<small>撳呢度開相機</small>'))+'</div></div>';
}

function viewNew(){
  $("app").innerHTML=
    '<div class="help">輸入樹木號碼 → 影事前／事後相（可選樹牌）→ 儲存。分享時相機會印上<strong>日期</strong>同<strong>事前／事後</strong>說明；本機紀錄可一次揀多筆合併成一個 ZIP。</div>'+
    '<div class="card">'+
      '<label>樹木號碼</label>'+
      '<input id="treeNo" placeholder="例如 T-12345 / 樹牌編號" value="'+(draft.treeNo||"").replace(/"/g,"&quot;")+'" oninput="draft.treeNo=this.value"/>'+
      '<label>工作備註（可選）</label>'+
      '<textarea id="note" rows="2" placeholder="例如：修剪枯枝、除草、灌溉" oninput="draft.note=this.value">'+(draft.note||"")+'</textarea>'+
      '<label>樹木資料相（樹牌／位置，可選）</label>'+
      '<div class="ph" style="max-width:100%;aspect-ratio:16/10" onclick="snap(\'info\')">'+(draft.info?'<img alt="" src="'+draft.info+'"/>':'＋ 影樹牌或樹木資料')+'</div>'+
      '<div class="photos">'+phBox("before","事前相")+phBox("after","事後相")+'</div>'+
      '<button class="btn" onclick="saveAndUpload()">儲存並上存公司資料夾</button>'+
      '<button class="btn2" onclick="saveAndShare()">儲存並系統分享</button>'+
      '<button class="btn3" onclick="saveRecord()">只儲存本機</button>'+
    '</div>';
}

function viewList(){
  if(!records.length){
    $("app").innerHTML='<div class="card empty">未有紀錄<br><button class="btn" style="margin-top:16px" onclick="go(\'new\')">建立第一筆</button></div>';
    return;
  }
  const sorted=[...records].sort((a,b)=>b.ts-a.ts);
  const n=selected.size;
  $("app").innerHTML=
    '<div class="bar">'+
      '<button class="btn sm btn3" onclick="toggleSelectAll()">'+ (n===records.length?"取消全選":"全選") +'</button>'+
      '<button class="btn sm" '+(n?"":"disabled")+' onclick="shareSelectedZip()">合併分享（'+n+'）</button>'+
    '</div>'+
    '<div class="muted" style="margin:0 0 8px">剔選多筆 → 合成<strong>一個 ZIP</strong>（入面每張相有日期同事前／事後說明）</div>'+
    sorted.map(r=>{
      const on=selected.has(r.id);
      return '<div class="card '+(on?"sel":"")+'">'+
        '<div class="row">'+
          '<label style="margin:0;display:flex;align-items:center;gap:8px;font-weight:700" onclick="event.stopPropagation()">'+
            '<input class="check" type="checkbox" '+(on?"checked":"")+' onchange="toggleSel(\''+r.id+'\',this.checked)"/>🌳 '+(r.treeNo||"無編號")+
          '</label>'+
          '<span class="tag">'+(r.uploaded?"已上存":(r.shared?"已分享":"本機"))+'</span>'+
        '</div>'+
        '<div class="muted" style="margin-top:6px" onclick="openRec(\''+r.id+'\')">'+(r.note||"無備註")+' · '+fmt(r.ts)+' · 撳睇詳情</div>'+
        '<div class="photos" style="margin-top:8px" onclick="openRec(\''+r.id+'\')">'+
          (r.before?'<div class="ph"><img alt="" src="'+r.before+'"/></div>':'')+
          (r.after?'<div class="ph"><img alt="" src="'+r.after+'"/></div>':'')+
        '</div></div>';
    }).join("");
}

function toggleSel(id,on){if(on)selected.add(id);else selected.delete(id);render();}
function toggleSelectAll(){if(selected.size===records.length)selected=new Set();else selected=new Set(records.map(r=>r.id));render();}

function openRec(id){viewing=records.find(x=>x.id===id);if(viewing)viewOne(viewing);}
function viewOne(r){
  $("app").innerHTML=
    '<button class="btn3" onclick="viewing=null;page=\'list\';render()">← 返回</button>'+
    '<div class="card" style="margin-top:10px">'+
      '<div class="title">樹木號碼：'+(r.treeNo||"—")+'</div>'+
      '<div class="muted">'+fmt(r.ts)+'</div>'+
      '<div style="margin-top:8px">'+(r.note||"無備註")+'</div>'+
      (r.info?'<label>樹木資料相</label><div class="ph" style="aspect-ratio:16/10"><img alt="" src="'+r.info+'"/></div>':'')+
      '<div class="photos">'+
        '<div><label>事前</label><div class="ph">'+(r.before?'<img alt="" src="'+r.before+'"/>':'無')+'</div></div>'+
        '<div><label>事後</label><div class="ph">'+(r.after?'<img alt="" src="'+r.after+'"/>':'無')+'</div></div>'+
      '</div>'+
      '<button class="btn" onclick="uploadRecord(\''+r.id+'\')">上存去公司資料夾</button>'+
      '<button class="btn2" onclick="shareRecord(\''+r.id+'\')">分享呢筆（含說明相）</button>'+
      '<button class="btn4" onclick="delRec(\''+r.id+'\')">刪除呢筆</button>'+
    '</div>';
}

function viewMe(){
  const url=getUploadUrl();
  $("app").innerHTML=
    '<div class="card"><div class="title">一次分享多棵樹</div>'+
    '<p class="muted" style="margin:8px 0 0">去「本機紀錄」剔選多筆 →「合併分享」→ 會產出一個 ZIP：每棵樹一個資料夾，相片已印<strong>事前／事後</strong>同<strong>日期</strong>，另有摘要文字。</p></div>'+
    '<div class="card"><div class="title">上存去公司資料夾</div>'+
    '<label>上存網址</label>'+
    '<textarea id="uploadUrl" rows="3" placeholder="https://script.google.com/macros/s/……/exec">'+(url||"")+'</textarea>'+
    '<button class="btn2" onclick="setUploadUrl($(\'uploadUrl\').value);toast(getUploadUrl()?\'已儲存上存網址\':\'已清空\');render()">儲存上存網址</button></div>'+
    '<div class="card"><div class="title">App 網址</div><p class="muted">https://davychan188.github.io/epcem-app/</p></div>'+
    '<button class="btn3" onclick="if(confirm(\'清除全部本機樹木紀錄？\')){records=[];selected=new Set();saveAll(records);toast(\'已清除\');go(\'list\')}">清除全部本機紀錄</button>';
}

function snap(which){snapTarget=which;const inp=$("cam");inp.value="";inp.click();}
function onCam(ev){
  const f=ev.target.files&&ev.target.files[0];
  if(!f||!snapTarget)return;
  const which=snapTarget;
  const reader=new FileReader();
  reader.onload=()=>{
    compressDataUrl(reader.result,1280,0.72).then(url=>{
      draft[which]=url;snapTarget=null;render();toast("已加入相片");
    }).catch(()=>{draft[which]=reader.result;snapTarget=null;render();toast("已加入相片");});
  };
  reader.onerror=()=>toast("讀取相片失敗");
  reader.readAsDataURL(f);
}
function compressDataUrl(dataUrl,maxW,q){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    img.onload=()=>{
      let w=img.width,h=img.height;
      if(w>maxW){h=Math.round(h*maxW/w);w=maxW;}
      const c=document.createElement("canvas");c.width=w;c.height=h;
      c.getContext("2d").drawImage(img,0,0,w,h);
      try{resolve(c.toDataURL("image/jpeg",q));}catch(e){reject(e);}
    };
    img.onerror=reject;img.src=dataUrl;
  });
}

/** Burn caption onto photo: 樹木號碼 + 事前/事後 + 日期 */
function stampPhoto(dataUrl, captionLines){
  return new Promise((resolve,reject)=>{
    if(!dataUrl)return resolve(null);
    const img=new Image();
    img.onload=()=>{
      const c=document.createElement("canvas");
      c.width=img.width;c.height=img.height;
      const ctx=c.getContext("2d");
      ctx.drawImage(img,0,0);
      const pad=Math.max(12,Math.round(c.width*0.02));
      const fontSize=Math.max(22,Math.round(c.width*0.035));
      ctx.font="bold "+fontSize+"px sans-serif";
      const lines=captionLines.filter(Boolean);
      const lineH=fontSize+8;
      const boxH=pad*2+lineH*lines.length;
      ctx.fillStyle="rgba(0,0,0,0.55)";
      ctx.fillRect(0,c.height-boxH,c.width,boxH);
      ctx.fillStyle="#fff";
      lines.forEach((line,i)=>{
        ctx.fillText(line,pad,c.height-boxH+pad+fontSize+i*lineH);
      });
      try{resolve(c.toDataURL("image/jpeg",0.85));}catch(e){reject(e);}
    };
    img.onerror=reject;img.src=dataUrl;
  });
}

function captionFor(r,kind){
  const kindLabel={before:"事前",after:"事後",info:"樹木資料"}[kind]||kind;
  return ["樹木 "+(r.treeNo||"—"), kindLabel, fmt(r.ts)];
}

async function stampedFilesForRecord(r){
  const files=[];
  const base=safeName(r.treeNo);
  if(r.info){
    const u=await stampPhoto(r.info, captionFor(r,"info"));
    files.push({name:base+"_樹木資料.jpg", dataUrl:u, kind:"info"});
  }
  if(r.before){
    const u=await stampPhoto(r.before, captionFor(r,"before"));
    files.push({name:base+"_事前.jpg", dataUrl:u, kind:"before"});
  }
  if(r.after){
    const u=await stampPhoto(r.after, captionFor(r,"after"));
    files.push({name:base+"_事後.jpg", dataUrl:u, kind:"after"});
  }
  return files;
}

function dataUrlToFile(dataUrl,name){
  const [head,b64]=dataUrl.split(",");
  const mime=(head.match(/data:(.*?);/)||[])[1]||"image/jpeg";
  const bin=atob(b64);const arr=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
  return new File([arr],name,{type:mime});
}
function dataUrlToUint8(dataUrl){
  const b64=dataUrl.split(",")[1];
  const bin=atob(b64);const arr=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
  return arr;
}

function validate(){
  if(!String(draft.treeNo||"").trim()){toast("請先填樹木號碼");return false;}
  if(!draft.before||!draft.after){toast("請影齊事前同事後相");return false;}
  return true;
}
function buildRecord(){
  return {
    id:"TR-"+Date.now()+"-"+Math.floor(Math.random()*999),
    treeNo:String(draft.treeNo||"").trim(),
    note:String(draft.note||"").trim(),
    info:draft.info||null,
    before:draft.before,
    after:draft.after,
    ts:Date.now(),
    shared:false
  };
}
function resetDraft(){draft={treeNo:"",note:"",info:null,before:null,after:null};}
function saveRecord(){
  if(!validate())return;
  const r=buildRecord();
  records.unshift(r);saveAll(records);resetDraft();
  toast("已儲存本機");go("list");
}
async function saveAndShare(){
  if(!validate())return;
  const r=buildRecord();
  records.unshift(r);saveAll(records);resetDraft();
  await shareRecord(r.id,true);
  go("list");
}

async function shareRecord(id,fromSave){
  const r=records.find(x=>x.id===id);if(!r)return;
  toast("準備相片說明中…");
  let stamped=[];
  try{stamped=await stampedFilesForRecord(r);}catch(e){console.error(e);toast("處理相片失敗");return;}
  const text="樹木工作紀錄\n樹木號碼："+r.treeNo+"\n時間："+fmt(r.ts)+"\n備註："+(r.note||"—")+"\n相片已標示：事前／事後＋日期";
  const files=stamped.map(x=>dataUrlToFile(x.dataUrl,x.name));
  try{
    if(navigator.canShare&&files.length&&navigator.canShare({files})){
      await navigator.share({title:"樹木 "+r.treeNo,text,files});
    }else if(navigator.share){
      await navigator.share({title:"樹木 "+r.treeNo,text});
      files.forEach(f=>{const a=document.createElement("a");a.href=URL.createObjectURL(f);a.download=f.name;a.click();});
    }else{
      files.forEach(f=>{const a=document.createElement("a");a.href=URL.createObjectURL(f);a.download=f.name;a.click();});
      await navigator.clipboard.writeText(text).catch(()=>{});
      toast("已下載有說明嘅相片");
    }
    r.shared=true;saveAll(records);
    toast(fromSave?"已儲存，請選點樣傳俾同事":"請選點樣傳俾同事");
  }catch(e){
    if(e&&e.name==="AbortError"){toast("已取消分享");return;}
    files.forEach(f=>{const a=document.createElement("a");a.href=URL.createObjectURL(f);a.download=f.name;a.click();});
    toast("已下載有說明嘅相片");
    r.shared=true;saveAll(records);
  }
  if(viewing)viewOne(r);
}

async function shareSelectedZip(){
  const list=records.filter(r=>selected.has(r.id));
  if(!list.length){toast("請先剔選紀錄");return;}
  if(typeof JSZip==="undefined"){toast("ZIP 元件未載入，請連網重試");return;}
  toast("合併 "+list.length+" 筆中…");
  try{
    const zip=new JSZip();
    const lines=["樹木工作紀錄合併包","產生時間："+fmt(Date.now()),"共 "+list.length+" 筆","",""];
    for(const r of list.sort((a,b)=>a.ts-b.ts)){
      const folder=zip.folder(safeName(r.treeNo)+"_"+safeName(fmt(r.ts).replace(/[\/\s:]/g,"-")));
      const stamped=await stampedFilesForRecord(r);
      for(const f of stamped)folder.file(f.name, dataUrlToUint8(f.dataUrl));
      folder.file("紀錄.txt",
        "樹木號碼："+r.treeNo+"\n時間："+fmt(r.ts)+"\n備註："+(r.note||"—")+"\n相片：事前／事後已印說明同日期\n");
      lines.push("- "+r.treeNo+" | "+fmt(r.ts)+" | "+(r.note||"—"));
    }
    zip.file("摘要.txt", lines.join("\n"));
    const blob=await zip.generateAsync({type:"blob"});
    const name="樹木紀錄_"+safeName(fmt(Date.now()).replace(/[\/\s:]/g,"-"))+".zip";
    const file=new File([blob],name,{type:"application/zip"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({title:"樹木紀錄合併",text:"共 "+list.length+" 棵樹／筆紀錄（相片含事前事後同日期）",files:[file]});
    }else{
      const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;a.click();
      toast("已下載合併 ZIP，請自行傳俾同事");
    }
    list.forEach(r=>{r.shared=true;});
    saveAll(records);
    toast("已合併分享 "+list.length+" 筆");
  }catch(e){
    if(e&&e.name==="AbortError"){toast("已取消分享");return;}
    console.error(e);
    toast("合併分享失敗");
  }
}

async function saveAndUpload(){
  if(!validate())return;
  if(!getUploadUrl()){toast("請先去「說明」貼上存網址");go("me");return;}
  const r=buildRecord();
  records.unshift(r);saveAll(records);resetDraft();
  await uploadRecord(r.id);
  go("list");
}
function stripDataUrl(dataUrl){
  if(!dataUrl)return null;
  const i=dataUrl.indexOf(",");
  return i>=0?dataUrl.slice(i+1):dataUrl;
}
async function uploadRecord(id){
  const r=records.find(x=>x.id===id);if(!r)return;
  const endpoint=getUploadUrl();
  if(!endpoint){toast("未設定上存網址");go("me");return;}
  toast("準備上存（含說明）…");
  let stamped=[];
  try{stamped=await stampedFilesForRecord(r);}catch(e){stamped=[];}
  const byKind=Object.fromEntries(stamped.map(x=>[x.kind,x.dataUrl]));
  const payload={
    id:r.id,treeNo:r.treeNo,note:r.note||"",ts:r.ts,timeText:fmt(r.ts),
    info:stripDataUrl(byKind.info||r.info),
    before:stripDataUrl(byKind.before||r.before),
    after:stripDataUrl(byKind.after||r.after)
  };
  try{
    const res=await fetch(endpoint,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
    const text=await res.text();
    let data={};try{data=JSON.parse(text);}catch(e){data={raw:text};}
    if(!res.ok||data.ok===false){toast("上存失敗："+(data.error||res.status));return;}
    r.shared=true;r.uploaded=true;r.uploadAt=Date.now();
    if(data.folderUrl)r.folderUrl=data.folderUrl;
    saveAll(records);toast("已上存公司資料夾");
    if(viewing)viewOne(r);
  }catch(e){console.error(e);toast("上存失敗，請檢查網址或網絡");}
}
function delRec(id){
  if(!confirm("刪除呢筆紀錄？"))return;
  records=records.filter(x=>x.id!==id);selected.delete(id);saveAll(records);viewing=null;toast("已刪除");go("list");
}

if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js?v=4").catch(()=>{});
go("new");
</script>
